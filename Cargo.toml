[workspace]
members = ["node", "pallets/template", "runtime"]
resolver = "2"

[workspace.package]
authors = ["IINK contributors"]
homepage = "https://github.com/Jedid1ahh/iink"
repository = "https://github.com/Jedid1ahh/iink"
edition = "2021"

[workspace.dependencies]
# Frontier and the SDK must share Cargo source identities. Cargo.lock pins the
# SDK branch and Frontier's EVM dependency to the verified commits.
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "deprecated"] }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
cumulus-pallet-weight-reclaim = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603", default-features = false }
cumulus-primitives-proof-size-hostfunction = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603", default-features = false }
ethereum = { version = "0.18.2", default-features = false }
fc-api = { git = "https://github.com/polkadot-evm/frontier.git", rev = "baf505d8feeaaa0ba636a003faa49e4ad897b592" }
fc-cli = { git = "https://github.com/polkadot-evm/frontier.git", rev = "baf505d8feeaaa0ba636a003faa49e4ad897b592", default-features = false }
